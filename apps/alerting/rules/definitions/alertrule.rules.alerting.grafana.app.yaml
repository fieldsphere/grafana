apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: alertrules.rules.alerting.grafana.app
spec:
  group: rules.alerting.grafana.app
  names:
    kind: AlertRule
    plural: alertrules
  scope: Namespaced
  versions:
  - name: v0alpha1
    schema:
      openAPIV3Schema:
        properties:
          spec:
            properties:
              annotations:
                additionalProperties:
                  type: string
                type: object
              execErrState:
                default: Error
                type: string
              expressions:
                additionalProperties:
                  properties:
                    datasourceUID:
                      description: '+k8s:validation:minLength=1

                        +k8s:validation:pattern="^[a-zA-Z0-9_-]+$"'
                      minLength: 1
                      type: string
                      pattern: ^[a-zA-Z0-9_-]+$
                    model:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    queryType:
                      description: The type of query if this is a query expression
                      type: string
                    relativeTimeRange:
                      properties:
                        from:
                          description: '+k8s:validation:minLength=1

                            +k8s:validation:pattern="^((([0-9]+)y)?(([0-9]+)w)?(([0-9]+)d)?(([0-9]+)h)?(([0-9]+)m)?(([0-9]+)s)?(([0-9]+)ms)?|0)$"'
                          type: string
                          minLength: 1
                          pattern: ^((([0-9]+)y)?(([0-9]+)w)?(([0-9]+)d)?(([0-9]+)h)?(([0-9]+)m)?(([0-9]+)s)?(([0-9]+)ms)?|0)$
                        to:
                          description: '+k8s:validation:minLength=1

                            +k8s:validation:pattern="^((([0-9]+)y)?(([0-9]+)w)?(([0-9]+)d)?(([0-9]+)h)?(([0-9]+)m)?(([0-9]+)s)?(([0-9]+)ms)?|0)$"'
                          type: string
                          minLength: 1
                          pattern: ^((([0-9]+)y)?(([0-9]+)w)?(([0-9]+)d)?(([0-9]+)h)?(([0-9]+)m)?(([0-9]+)s)?(([0-9]+)ms)?|0)$
                      required:
                      - from
                      - to
                      type: object
                    source:
                      description: 'Used to mark the expression to be used as the final source for the rule evaluation

                        Only one expression in a rule can be marked as the source

                        For AlertRules, this is the expression that will be evaluated against the alerting condition

                        For RecordingRules, this is the expression that will be recorded'
                      type: boolean
                  required:
                  - model
                  type: object
                description: 'Expressions must contain at least one entry. Admission validation enforces exactly one expression
                  with source=true.

                  +k8s:validation:minProperties=1'
                type: object
                minProperties: 1
              for:
                description: '+k8s:validation:minLength=1

                  +k8s:validation:pattern="^((([0-9]+)y)?(([0-9]+)w)?(([0-9]+)d)?(([0-9]+)h)?(([0-9]+)m)?(([0-9]+)s)?|0)$"'
                type: string
                minLength: 1
                pattern: ^((([0-9]+)y)?(([0-9]+)w)?(([0-9]+)d)?(([0-9]+)h)?(([0-9]+)m)?(([0-9]+)s)?|0)$
              keepFiringFor:
                description: '+k8s:validation:minLength=1

                  +k8s:validation:pattern="^((([0-9]+)y)?(([0-9]+)w)?(([0-9]+)d)?(([0-9]+)h)?(([0-9]+)m)?(([0-9]+)s)?|0)$"'
                type: string
                minLength: 1
                pattern: ^((([0-9]+)y)?(([0-9]+)w)?(([0-9]+)d)?(([0-9]+)h)?(([0-9]+)m)?(([0-9]+)s)?|0)$
              labels:
                additionalProperties:
                  type: string
                type: object
              missingSeriesEvalsToResolve:
                description: +k8s:validation:minimum=0
                minimum: 0
                type: integer
              noDataState:
                default: NoData
                type: string
              notificationSettings:
                properties:
                  activeTimeIntervals:
                    description: '+k8s:validation:items:minLength=1

                      +k8s:validation:items:pattern="^.+$"'
                    items:
                      description: 'TimeIntervalRef matches the non-empty TimeIntervalSpec.name validation from the notifications
                        app.

                        +k8s:validation:minLength=1

                        +k8s:validation:pattern="^.+$"'
                      minLength: 1
                      type: string
                      pattern: ^.+$
                    type: array
                  groupBy:
                    items:
                      type: string
                    type: array
                  groupInterval:
                    description: '+k8s:validation:minLength=1

                      +k8s:validation:pattern="^((([0-9]+)y)?(([0-9]+)w)?(([0-9]+)d)?(([0-9]+)h)?(([0-9]+)m)?(([0-9]+)s)?|0)$"'
                    type: string
                    minLength: 1
                    pattern: ^((([0-9]+)y)?(([0-9]+)w)?(([0-9]+)d)?(([0-9]+)h)?(([0-9]+)m)?(([0-9]+)s)?|0)$
                  groupWait:
                    description: '+k8s:validation:minLength=1

                      +k8s:validation:pattern="^((([0-9]+)y)?(([0-9]+)w)?(([0-9]+)d)?(([0-9]+)h)?(([0-9]+)m)?(([0-9]+)s)?|0)$"'
                    type: string
                    minLength: 1
                    pattern: ^((([0-9]+)y)?(([0-9]+)w)?(([0-9]+)d)?(([0-9]+)h)?(([0-9]+)m)?(([0-9]+)s)?|0)$
                  muteTimeIntervals:
                    description: '+k8s:validation:items:minLength=1

                      +k8s:validation:items:pattern="^.+$"'
                    items:
                      description: 'TimeIntervalRef matches the non-empty TimeIntervalSpec.name validation from the notifications
                        app.

                        +k8s:validation:minLength=1

                        +k8s:validation:pattern="^.+$"'
                      minLength: 1
                      type: string
                      pattern: ^.+$
                    type: array
                  receiver:
                    description: +k8s:validation:minLength=1
                    minLength: 1
                    type: string
                  repeatInterval:
                    description: '+k8s:validation:minLength=1

                      +k8s:validation:pattern="^((([0-9]+)y)?(([0-9]+)w)?(([0-9]+)d)?(([0-9]+)h)?(([0-9]+)m)?(([0-9]+)s)?|0)$"'
                    type: string
                    minLength: 1
                    pattern: ^((([0-9]+)y)?(([0-9]+)w)?(([0-9]+)d)?(([0-9]+)h)?(([0-9]+)m)?(([0-9]+)s)?|0)$
                required:
                - receiver
                type: object
              panelRef:
                properties:
                  dashboardUID:
                    description: '+k8s:validation:minLength=1

                      +k8s:validation:pattern="^[a-zA-Z0-9_-]+$"'
                    minLength: 1
                    type: string
                    pattern: ^[a-zA-Z0-9_-]+$
                  panelID:
                    description: '+k8s:validation:minimum=0

                      +k8s:validation:exclusiveMinimum'
                    exclusiveMinimum: true
                    minimum: 0
                    type: integer
                required:
                - dashboardUID
                - panelID
                type: object
              paused:
                type: boolean
              title:
                description: +k8s:validation:minLength=1
                minLength: 1
                type: string
              trigger:
                properties:
                  interval:
                    description: '+k8s:validation:minLength=1

                      +k8s:validation:pattern="^((([0-9]+)y)?(([0-9]+)w)?(([0-9]+)d)?(([0-9]+)h)?(([0-9]+)m)?(([0-9]+)s)?|0)$"'
                    type: string
                    minLength: 1
                    pattern: ^((([0-9]+)y)?(([0-9]+)w)?(([0-9]+)d)?(([0-9]+)h)?(([0-9]+)m)?(([0-9]+)s)?|0)$
                required:
                - interval
                type: object
            required:
            - title
            - trigger
            - noDataState
            - execErrState
            - expressions
            type: object
          status:
            properties:
              additionalFields:
                description: additionalFields is reserved for future use
                type: object
                x-kubernetes-preserve-unknown-fields: true
              operatorStates:
                additionalProperties:
                  properties:
                    descriptiveState:
                      description: descriptiveState is an optional more descriptive state field which has no requirements
                        on format
                      type: string
                    details:
                      description: details contains any extra information that is operator-specific
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    lastEvaluation:
                      description: lastEvaluation is the ResourceVersion last evaluated
                      type: string
                    state:
                      description: 'state describes the state of the lastEvaluation.

                        It is limited to three possible states for machine evaluation.'
                      enum:
                      - success
                      - in_progress
                      - failed
                      type: string
                  required:
                  - lastEvaluation
                  - state
                  type: object
                description: 'operatorStates is a map of operator ID to operator state evaluations.

                  Any operator which consumes this kind SHOULD add its state evaluation information to this field.'
                type: object
            type: object
        required:
        - spec
        type: object
    selectableFields:
    - jsonPath: .spec.title
    - jsonPath: .spec.paused
    - jsonPath: .spec.panelRef.dashboardUID
    - jsonPath: .spec.panelRef.panelID
    - jsonPath: .spec.notificationSettings.receiver
    served: true
    storage: true
    subresources:
      status: {}
