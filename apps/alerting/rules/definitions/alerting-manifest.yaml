apiVersion: apps.grafana.app/v1alpha2
kind: AppManifest
metadata:
  name: alerting
spec:
  appDisplayName: alerting
  appName: alerting
  group: rules.alerting.grafana.app
  preferredVersion: v0alpha1
  versions:
  - kinds:
    - admission:
        mutation:
          operations:
          - CREATE
          - UPDATE
        validation:
          operations:
          - CREATE
          - UPDATE
      conversion: false
      kind: AlertRule
      plural: AlertRules
      schemas:
        AlertRule:
          properties:
            spec:
              $ref: '#/components/schemas/spec'
            status:
              $ref: '#/components/schemas/status'
          required:
          - spec
        DatasourceUID:
          description: '+k8s:validation:minLength=1

            +k8s:validation:pattern="^[a-zA-Z0-9_-]+$"'
          minLength: 1
          type: string
          pattern: ^[a-zA-Z0-9_-]+$
        Expression:
          additionalProperties: false
          properties:
            datasourceUID:
              $ref: '#/components/schemas/DatasourceUID'
              description: 'The UID of the datasource to run this expression against. If omitted, the expression will be run
                against the `__expr__` datasource

                +k8s:validation:minLength=1

                +k8s:validation:pattern="^[a-zA-Z0-9_-]+$"'
            model:
              additionalProperties: {}
              type: object
            queryType:
              description: The type of query if this is a query expression
              type: string
            relativeTimeRange:
              $ref: '#/components/schemas/RelativeTimeRange'
            source:
              description: 'Used to mark the expression to be used as the final source for the rule evaluation

                Only one expression in a rule can be marked as the source

                For AlertRules, this is the expression that will be evaluated against the alerting condition

                For RecordingRules, this is the expression that will be recorded'
              type: boolean
          required:
          - model
          type: object
        ExpressionMap:
          additionalProperties:
            $ref: '#/components/schemas/Expression'
          description: 'Expressions must contain at least one entry. Admission validation enforces exactly one expression
            with source=true.

            +k8s:validation:minProperties=1'
          type: object
          minProperties: 1
        IntervalTrigger:
          additionalProperties: false
          properties:
            interval:
              $ref: '#/components/schemas/PromDuration'
              description: '+k8s:validation:minLength=1

                +k8s:validation:pattern="^((([0-9]+)y)?(([0-9]+)w)?(([0-9]+)d)?(([0-9]+)h)?(([0-9]+)m)?(([0-9]+)s)?|0)$"'
          required:
          - interval
          type: object
        OperatorState:
          additionalProperties: false
          properties:
            descriptiveState:
              description: descriptiveState is an optional more descriptive state field which has no requirements on format
              type: string
            details:
              additionalProperties: true
              description: details contains any extra information that is operator-specific
              type: object
            lastEvaluation:
              description: lastEvaluation is the ResourceVersion last evaluated
              type: string
            state:
              description: 'state describes the state of the lastEvaluation.

                It is limited to three possible states for machine evaluation.'
              enum:
              - success
              - in_progress
              - failed
              type: string
          required:
          - lastEvaluation
          - state
          type: object
        PromDuration:
          description: '+k8s:validation:minLength=1

            +k8s:validation:pattern="^((([0-9]+)y)?(([0-9]+)w)?(([0-9]+)d)?(([0-9]+)h)?(([0-9]+)m)?(([0-9]+)s)?|0)$"'
          type: string
          minLength: 1
          pattern: ^((([0-9]+)y)?(([0-9]+)w)?(([0-9]+)d)?(([0-9]+)h)?(([0-9]+)m)?(([0-9]+)s)?|0)$
        PromDurationWMillis:
          description: '+k8s:validation:minLength=1

            +k8s:validation:pattern="^((([0-9]+)y)?(([0-9]+)w)?(([0-9]+)d)?(([0-9]+)h)?(([0-9]+)m)?(([0-9]+)s)?(([0-9]+)ms)?|0)$"'
          type: string
          minLength: 1
          pattern: ^((([0-9]+)y)?(([0-9]+)w)?(([0-9]+)d)?(([0-9]+)h)?(([0-9]+)m)?(([0-9]+)s)?(([0-9]+)ms)?|0)$
        RelativeTimeRange:
          additionalProperties: false
          properties:
            from:
              $ref: '#/components/schemas/PromDurationWMillis'
              description: '+k8s:validation:minLength=1

                +k8s:validation:pattern="^((([0-9]+)y)?(([0-9]+)w)?(([0-9]+)d)?(([0-9]+)h)?(([0-9]+)m)?(([0-9]+)s)?(([0-9]+)ms)?|0)$"'
            to:
              $ref: '#/components/schemas/PromDurationWMillis'
              description: '+k8s:validation:minLength=1

                +k8s:validation:pattern="^((([0-9]+)y)?(([0-9]+)w)?(([0-9]+)d)?(([0-9]+)h)?(([0-9]+)m)?(([0-9]+)s)?(([0-9]+)ms)?|0)$"'
          required:
          - from
          - to
          type: object
        TemplateString:
          type: string
        TimeIntervalRef:
          description: 'TimeIntervalRef matches the non-empty TimeIntervalSpec.name validation from the notifications app.

            +k8s:validation:minLength=1

            +k8s:validation:pattern="^.+$"'
          minLength: 1
          type: string
          pattern: ^.+$
        Trigger:
          $ref: '#/components/schemas/IntervalTrigger'
        spec:
          additionalProperties: false
          properties:
            annotations:
              additionalProperties:
                $ref: '#/components/schemas/TemplateString'
              type: object
            execErrState:
              default: Error
              type: string
            expressions:
              $ref: '#/components/schemas/ExpressionMap'
              description: 'Expressions must contain at least one entry. Admission validation enforces exactly one expression
                with source=true.

                +k8s:validation:minProperties=1'
              minProperties: 1
            for:
              description: '+k8s:validation:minLength=1

                +k8s:validation:pattern="^((([0-9]+)y)?(([0-9]+)w)?(([0-9]+)d)?(([0-9]+)h)?(([0-9]+)m)?(([0-9]+)s)?|0)$"'
              type: string
              minLength: 1
              pattern: ^((([0-9]+)y)?(([0-9]+)w)?(([0-9]+)d)?(([0-9]+)h)?(([0-9]+)m)?(([0-9]+)s)?|0)$
            keepFiringFor:
              description: '+k8s:validation:minLength=1

                +k8s:validation:pattern="^((([0-9]+)y)?(([0-9]+)w)?(([0-9]+)d)?(([0-9]+)h)?(([0-9]+)m)?(([0-9]+)s)?|0)$"'
              type: string
              minLength: 1
              pattern: ^((([0-9]+)y)?(([0-9]+)w)?(([0-9]+)d)?(([0-9]+)h)?(([0-9]+)m)?(([0-9]+)s)?|0)$
            labels:
              additionalProperties:
                $ref: '#/components/schemas/TemplateString'
              type: object
            missingSeriesEvalsToResolve:
              description: +k8s:validation:minimum=0
              minimum: 0
              type: integer
            noDataState:
              default: NoData
              type: string
            notificationSettings:
              additionalProperties: false
              properties:
                activeTimeIntervals:
                  description: '+k8s:validation:items:minLength=1

                    +k8s:validation:items:pattern="^.+$"'
                  items:
                    $ref: '#/components/schemas/TimeIntervalRef'
                  type: array
                groupBy:
                  items:
                    type: string
                  type: array
                groupInterval:
                  $ref: '#/components/schemas/PromDuration'
                  description: '+k8s:validation:minLength=1

                    +k8s:validation:pattern="^((([0-9]+)y)?(([0-9]+)w)?(([0-9]+)d)?(([0-9]+)h)?(([0-9]+)m)?(([0-9]+)s)?|0)$"'
                groupWait:
                  $ref: '#/components/schemas/PromDuration'
                  description: '+k8s:validation:minLength=1

                    +k8s:validation:pattern="^((([0-9]+)y)?(([0-9]+)w)?(([0-9]+)d)?(([0-9]+)h)?(([0-9]+)m)?(([0-9]+)s)?|0)$"'
                muteTimeIntervals:
                  description: '+k8s:validation:items:minLength=1

                    +k8s:validation:items:pattern="^.+$"'
                  items:
                    $ref: '#/components/schemas/TimeIntervalRef'
                  type: array
                receiver:
                  description: +k8s:validation:minLength=1
                  minLength: 1
                  type: string
                repeatInterval:
                  $ref: '#/components/schemas/PromDuration'
                  description: '+k8s:validation:minLength=1

                    +k8s:validation:pattern="^((([0-9]+)y)?(([0-9]+)w)?(([0-9]+)d)?(([0-9]+)h)?(([0-9]+)m)?(([0-9]+)s)?|0)$"'
              required:
              - receiver
              type: object
            panelRef:
              additionalProperties: false
              properties:
                dashboardUID:
                  description: '+k8s:validation:minLength=1

                    +k8s:validation:pattern="^[a-zA-Z0-9_-]+$"'
                  minLength: 1
                  type: string
                  pattern: ^[a-zA-Z0-9_-]+$
                panelID:
                  description: '+k8s:validation:minimum=0

                    +k8s:validation:exclusiveMinimum'
                  exclusiveMinimum: true
                  minimum: 0
                  type: integer
              required:
              - dashboardUID
              - panelID
              type: object
            paused:
              type: boolean
            title:
              description: +k8s:validation:minLength=1
              minLength: 1
              type: string
            trigger:
              $ref: '#/components/schemas/Trigger'
          required:
          - title
          - trigger
          - noDataState
          - execErrState
          - expressions
          type: object
        status:
          additionalProperties: false
          properties:
            additionalFields:
              additionalProperties: true
              description: additionalFields is reserved for future use
              type: object
            operatorStates:
              additionalProperties:
                $ref: '#/components/schemas/OperatorState'
              description: 'operatorStates is a map of operator ID to operator state evaluations.

                Any operator which consumes this kind SHOULD add its state evaluation information to this field.'
              type: object
          type: object
      scope: Namespaced
      selectableFields:
      - spec.title
      - spec.paused
      - spec.panelRef.dashboardUID
      - spec.panelRef.panelID
      - spec.notificationSettings.receiver
    - admission:
        mutation:
          operations:
          - CREATE
          - UPDATE
        validation:
          operations:
          - CREATE
          - UPDATE
      conversion: false
      kind: RecordingRule
      plural: RecordingRules
      schemas:
        DatasourceUID:
          description: '+k8s:validation:minLength=1

            +k8s:validation:pattern="^[a-zA-Z0-9_-]+$"'
          minLength: 1
          type: string
          pattern: ^[a-zA-Z0-9_-]+$
        Expression:
          additionalProperties: false
          properties:
            datasourceUID:
              $ref: '#/components/schemas/DatasourceUID'
              description: 'The UID of the datasource to run this expression against. If omitted, the expression will be run
                against the `__expr__` datasource

                +k8s:validation:minLength=1

                +k8s:validation:pattern="^[a-zA-Z0-9_-]+$"'
            model:
              additionalProperties: {}
              type: object
            queryType:
              description: The type of query if this is a query expression
              type: string
            relativeTimeRange:
              $ref: '#/components/schemas/RelativeTimeRange'
            source:
              description: 'Used to mark the expression to be used as the final source for the rule evaluation

                Only one expression in a rule can be marked as the source

                For AlertRules, this is the expression that will be evaluated against the alerting condition

                For RecordingRules, this is the expression that will be recorded'
              type: boolean
          required:
          - model
          type: object
        ExpressionMap:
          additionalProperties:
            $ref: '#/components/schemas/Expression'
          description: 'Expressions must contain at least one entry. Admission validation enforces exactly one expression
            with source=true.

            +k8s:validation:minProperties=1'
          type: object
          minProperties: 1
        IntervalTrigger:
          additionalProperties: false
          properties:
            interval:
              $ref: '#/components/schemas/PromDuration'
              description: '+k8s:validation:minLength=1

                +k8s:validation:pattern="^((([0-9]+)y)?(([0-9]+)w)?(([0-9]+)d)?(([0-9]+)h)?(([0-9]+)m)?(([0-9]+)s)?|0)$"'
          required:
          - interval
          type: object
        OperatorState:
          additionalProperties: false
          properties:
            descriptiveState:
              description: descriptiveState is an optional more descriptive state field which has no requirements on format
              type: string
            details:
              additionalProperties: true
              description: details contains any extra information that is operator-specific
              type: object
            lastEvaluation:
              description: lastEvaluation is the ResourceVersion last evaluated
              type: string
            state:
              description: 'state describes the state of the lastEvaluation.

                It is limited to three possible states for machine evaluation.'
              enum:
              - success
              - in_progress
              - failed
              type: string
          required:
          - lastEvaluation
          - state
          type: object
        PromDuration:
          description: '+k8s:validation:minLength=1

            +k8s:validation:pattern="^((([0-9]+)y)?(([0-9]+)w)?(([0-9]+)d)?(([0-9]+)h)?(([0-9]+)m)?(([0-9]+)s)?|0)$"'
          type: string
          minLength: 1
          pattern: ^((([0-9]+)y)?(([0-9]+)w)?(([0-9]+)d)?(([0-9]+)h)?(([0-9]+)m)?(([0-9]+)s)?|0)$
        PromDurationWMillis:
          description: '+k8s:validation:minLength=1

            +k8s:validation:pattern="^((([0-9]+)y)?(([0-9]+)w)?(([0-9]+)d)?(([0-9]+)h)?(([0-9]+)m)?(([0-9]+)s)?(([0-9]+)ms)?|0)$"'
          type: string
          minLength: 1
          pattern: ^((([0-9]+)y)?(([0-9]+)w)?(([0-9]+)d)?(([0-9]+)h)?(([0-9]+)m)?(([0-9]+)s)?(([0-9]+)ms)?|0)$
        RecordingRule:
          properties:
            spec:
              $ref: '#/components/schemas/spec'
            status:
              $ref: '#/components/schemas/status'
          required:
          - spec
        RelativeTimeRange:
          additionalProperties: false
          properties:
            from:
              $ref: '#/components/schemas/PromDurationWMillis'
              description: '+k8s:validation:minLength=1

                +k8s:validation:pattern="^((([0-9]+)y)?(([0-9]+)w)?(([0-9]+)d)?(([0-9]+)h)?(([0-9]+)m)?(([0-9]+)s)?(([0-9]+)ms)?|0)$"'
            to:
              $ref: '#/components/schemas/PromDurationWMillis'
              description: '+k8s:validation:minLength=1

                +k8s:validation:pattern="^((([0-9]+)y)?(([0-9]+)w)?(([0-9]+)d)?(([0-9]+)h)?(([0-9]+)m)?(([0-9]+)s)?(([0-9]+)ms)?|0)$"'
          required:
          - from
          - to
          type: object
        TemplateString:
          type: string
        Trigger:
          $ref: '#/components/schemas/IntervalTrigger'
        spec:
          additionalProperties: false
          properties:
            expressions:
              $ref: '#/components/schemas/ExpressionMap'
              description: 'Expressions must contain at least one entry. Admission validation enforces exactly one expression
                with source=true.

                +k8s:validation:minProperties=1'
              minProperties: 1
            labels:
              additionalProperties:
                $ref: '#/components/schemas/TemplateString'
              type: object
            metric:
              description: '+k8s:validation:minLength=1

                +k8s:validation:pattern="^[a-zA-Z_:][a-zA-Z0-9_:]*$"'
              type: string
              minLength: 1
              pattern: ^[a-zA-Z_:][a-zA-Z0-9_:]*$
            paused:
              type: boolean
            targetDatasourceUID:
              description: '+k8s:validation:minLength=1

                +k8s:validation:pattern="^[a-zA-Z0-9_-]+$"'
              type: string
              minLength: 1
              pattern: ^[a-zA-Z0-9_-]+$
            title:
              description: +k8s:validation:minLength=1
              minLength: 1
              type: string
            trigger:
              $ref: '#/components/schemas/Trigger'
          required:
          - title
          - trigger
          - metric
          - expressions
          - targetDatasourceUID
          type: object
        status:
          additionalProperties: false
          properties:
            additionalFields:
              additionalProperties: true
              description: additionalFields is reserved for future use
              type: object
            operatorStates:
              additionalProperties:
                $ref: '#/components/schemas/OperatorState'
              description: 'operatorStates is a map of operator ID to operator state evaluations.

                Any operator which consumes this kind SHOULD add its state evaluation information to this field.'
              type: object
          type: object
      scope: Namespaced
      selectableFields:
      - spec.title
      - spec.paused
      - spec.metric
      - spec.targetDatasourceUID
    name: v0alpha1
    served: true
